name: Publish Tzar Everything
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Build the site
        run: npm run build -- --pathprefix="/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4

